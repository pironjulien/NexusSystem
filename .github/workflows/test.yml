name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Secrets: the whole history, every push and pull request (the official action; no licence for a personal account).
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Workflow audit: findings fail the job (no code scanning upload, so read-only).
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
  # Exactly what test.ps1 runs on the PC: PowerShell lint, then dotnet test (catalogs, pack dry runs under Windows
  # PowerShell 5.1, the app's build and tests).
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
      - name: PSScriptAnalyzer
        shell: pwsh
        run: if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
      - name: test.ps1
        shell: pwsh
        run: ./test.ps1
      # The release builds the native maintenance engine for both architectures: the same build on every push.
      - name: NexusMaintenance native build (x64, ARM64)
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish app/src/Nexus.Maintenance/Nexus.Maintenance.csproj -c Release -r "win-$arch" -o "$env:RUNNER_TEMP/engine-$arch"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      # The engine replaces itself while it runs: its file is renamed aside and the new one takes its path. The real
      # x64 engine, started then swapped before any of its code runs, must complete its cycle from its own image.
      - name: NexusMaintenance keeps running when its file is replaced
        shell: pwsh
        run: ./tests/test_engine_replacement.ps1 -Engine "$env:RUNNER_TEMP/engine-x64/NexusMaintenance.exe"

  # The full installation on a clean Windows (job pack) is pack.yml: run by hand, and by every release before it
  # publishes anything (release.yml).
