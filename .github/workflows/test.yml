name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Secrets: the whole history, every push and pull request (the official action; no licence for a personal account).
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Workflow audit: findings fail the job (no code scanning upload, so read-only).
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
  # Exactly what test.ps1 runs on the PC: PowerShell lint, then dotnet test (catalogs, pack dry runs under Windows
  # PowerShell 5.1, the app's build and tests).
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: PSScriptAnalyzer
        shell: pwsh
        run: if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
      - name: test.ps1
        shell: pwsh
        run: ./test.ps1

  # The one-liner on a clean runner: the official Claude Code installer, the pinned signed Codex engine, and the
  # folders by which Claude Desktop and Antigravity are found. Codex must install real plugins; an empty .codex folder
  # cannot stand in for its engine. Each product's native get.ps1 (its latest release) installs its engine; then every
  # server that each AI app declares is reached as that app would reach it (InstallTests). Run by hand: it depends on
  # the products' published releases, not on this commit alone.
  pack:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Official Codex engine (pinned release, SHA-256 and OpenAI signature verified)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue' # PowerShell 5.1 progress makes this large binary download very slow.
          $toolDir = Join-Path $env:RUNNER_TEMP 'codex-0.165.0'
          New-Item -ItemType Directory -Force $toolDir | Out-Null
          $engine = Join-Path $toolDir 'codex.exe'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/openai/codex/releases/download/rust-v0.165.0/codex-x86_64-pc-windows-msvc.exe' -OutFile $engine
          if ((Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash -ne 'D4B2E6A054EA1DFE53217F9D8942C5F8A9F4B76171A1E0BB76CED5759915300A') { throw 'Codex release SHA-256 mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath $engine
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -notmatch '(^|,\s*)(CN|O)="OpenAI OpCo, LLC"(?=,|$)') { throw 'Codex release lacks a valid OpenAI signature' }
          if ((& $engine --version) -ne 'codex-cli 0.165.0' -or $LASTEXITCODE) { throw 'Unexpected Codex engine version' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolDir
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: AI apps present (Claude Code installed, Claude Desktop and Antigravity found by their folders)
        shell: powershell
        run: |
          irm https://claude.ai/install.ps1 | iex
          New-Item -ItemType Directory -Force "$env:APPDATA\Claude", "$env:USERPROFILE\.gemini\antigravity" | Out-Null
      - name: get-nexus.ps1 (Windows PowerShell 5.1), this commit's catalog
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          ./get-nexus.ps1 -Catalog $PWD -NoGuide
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Every declared server starts
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;" + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:NEXUS_MCP_TOKEN = [Environment]::GetEnvironmentVariable('NEXUS_MCP_TOKEN', 'User')
          $env:NEXUS_PACK_CHECK_AIS = 'claude-code,claude-desktop,codex,antigravity'
          $env:NEXUS_PACK_CHECK_PRODUCTS = 'windows,android,browser,relay'
          dotnet test --project tests/NexusSystem.Tests --filter-class NexusSystem.Tests.InstallTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NEXUS_PACK_CHECK_AIS = 'antigravity'; $env:NEXUS_PACK_CHECK_PRODUCTS = 'agymail'
          dotnet test --project tests/NexusSystem.Tests --filter-class NexusSystem.Tests.InstallTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          claude mcp list
      - name: Second run changes nothing and stays green
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          ./get-nexus.ps1 -Catalog $PWD -NoGuide
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
