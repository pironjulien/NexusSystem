# Shared by the Nexus products (workflow_call): publish a tested build as a development pre-release.
# The calling workflow tests and builds, then uploads its release files as the artifact `dist` (packages, get.ps1,
# SHA256SUMS.txt). This attests their build provenance (Sigstore, keyless: `gh attestation verify <file> --repo
# pironjulien/<Product>`; the bundle is attached as <Product>-X.Y.Z.intoto.jsonl) and publishes them as the pre-release
# vX.Y.Z-dev.N at the built commit. Only NexusSystem's development channel installs those; releases/latest never
# points to one. The five newest development builds are kept; a promoted build lives on in its stable release.
name: product-dev-release

on:
  workflow_call:
    inputs:
      product:
        description: Product name, as in its release titles (e.g. NexusAndroid)
        required: true
        type: string
      version:
        description: The X.Y.Z the build carries (checked by the caller in every file)
        required: true
        type: string
    outputs:
      tag:
        description: The development tag published (vX.Y.Z-dev.N)
        value: ${{ jobs.publish.outputs.tag }}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: Checksums match the files
        run: |
          set -euo pipefail
          cd dist
          tr -d '\r' < SHA256SUMS.txt | sha256sum --strict -c -
          listed=$(tr -d '\r' < SHA256SUMS.txt | awk '{print $2}' | sort)
          present=$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort)
          [[ "$listed" == "$present" ]] || { echo "SHA256SUMS.txt does not list exactly the release files"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        id: provenance
        with:
          subject-path: dist/*
      - name: Development pre-release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
          RUN: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not an X.Y.Z version: $VERSION"; exit 1; }
          tag="v$VERSION-dev.$RUN"
          cp "$BUNDLE" "dist/$PRODUCT-$VERSION.intoto.jsonl"
          gh release create "$tag" dist/* --repo "$REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "$PRODUCT $VERSION (development build)" \
            --notes "Development build of $GITHUB_SHA (tests passed). Installed only by NexusSystem's development channel; promoted as is to the stable v$VERSION."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release list --repo "$REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do gh release delete "$old" --repo "$REPOSITORY" --cleanup-tag --yes; done
