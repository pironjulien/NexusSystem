# Shared by the Nexus products (workflow_call): promote a tested development build to the stable release, right after
# the push that built it, or by hand. A build whose stable version already exists is left as is (tag output empty).
# Nothing is published before every check of the build's commit is green (job checks): the product's own workflows on
# that commit (each workflow file it declares in required-workflows must have run there: Tests, Security, CodeQL...),
# other apps' check runs and the commit statuses. Those still running are awaited up to checks-timeout-minutes; one
# red, cancelled, absent or unfinished refuses the promotion and is named. The calling workflow itself is left out:
# its build ran test.ps1 before this point.
# The SAME files, checked against their SHA256SUMS.txt, become the release vX.Y.Z at the same commit, with that
# version's CHANGELOG section as notes; nothing is rebuilt between the tested build and the stable release. With
# mcp-registry, the product's server.json at the promoted tag then goes to the official MCP registry by GitHub OIDC,
# every .mcpb package it lists checked against the release's SHA256SUMS.txt.
# registry-only re-sends a stable release's server.json without promoting anything.
# The calling job grants contents: write and id-token: write (registry), plus actions: read, checks: read and
# statuses: read for the checks (read only, in their own job).
name: product-promote

on:
  workflow_call:
    inputs:
      product:
        description: Product name, as in its release titles (e.g. NexusAndroid)
        required: true
        type: string
      promote:
        description: Development build to promote (vX.Y.Z-dev.N); empty = the newest
        required: false
        type: string
        default: ''
      registry-only:
        description: Only send this stable release's server.json (vX.Y.Z) to the MCP registry again
        required: false
        type: string
        default: ''
      mcp-registry:
        description: Publish the product's server.json (every .mcpb it lists) to the official MCP registry
        required: false
        type: boolean
        default: false
      mcp-package:
        description: Deprecated, same as mcp-registry when not empty (the packages now come from server.json)
        required: false
        type: string
        default: ''
      required-workflows:
        description: >-
          Workflow files of .github/workflows (space-separated) that must have run green on the build's commit; every
          other check found on that commit must be green too
        required: false
        type: string
        default: tests.yml security.yml codeql.yml
      checks-timeout-minutes:
        description: How long to wait for the commit's checks still running before refusing
        required: false
        type: number
        default: 60
    outputs:
      tag:
        description: The stable tag published (vX.Y.Z)
        value: ${{ jobs.promote.outputs.tag }}

permissions: {}

jobs:
  # The development build to promote and its commit; nothing to do (commit empty) when its version is released.
  resolve:
    if: inputs.registry-only == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dev: ${{ steps.build.outputs.dev }}
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Development build to promote
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE: ${{ inputs.promote }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          dev="$PROMOTE"
          if [[ -z "$dev" ]]; then
            dev=$(gh release list --repo "$REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\.[0-9]+$")))] | sort_by(.createdAt) | last | .tagName')
          fi
          [[ "$dev" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-dev\.[0-9]+$ ]] || { echo "Not a development build: $dev"; exit 1; }
          stable="v${BASH_REMATCH[1]}"
          if gh release view "$stable" --repo "$REPOSITORY" >/dev/null 2>&1; then
            # A push that did not raise the version: its development build stays a development build.
            echo "::notice::$stable is already released: nothing promoted (raise the version to release $dev)."
            exit 0
          fi
          commit=$(gh release view "$dev" --repo "$REPOSITORY" --json targetCommitish --jq .targetCommitish)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || commit=$(git rev-list -n 1 "$dev")
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "No commit found for $dev"; exit 1; }
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # Every check of the build's commit green before anything is published (read only, no checkout). All the runs of the
  # calling workflow on that commit are left out, an earlier refused promotion included; everything else counts.
  checks:
    needs: resolve
    if: needs.resolve.outputs.commit != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    steps:
      - name: Every check of the commit is green
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          DEV: ${{ needs.resolve.outputs.dev }}
          RUN_ID: ${{ github.run_id }}
          REQUIRED: ${{ inputs.required-workflows }}
          TIMEOUT_MINUTES: ${{ inputs.checks-timeout-minutes }}
          POLL_SECONDS: '30'
        run: |
          # The build's commit: the product's workflow runs (latest run of each .github/workflows file, the calling workflow
          # left out), other apps' check runs and commit statuses. Red: refused at once. Running or not started yet: awaited.
          import json, os, re, sys, time, urllib.error, urllib.request

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          token = os.environ["GH_TOKEN"]
          repo, commit, dev = os.environ["REPOSITORY"], os.environ["COMMIT"], os.environ.get("DEV", "")
          run_id = os.environ["RUN_ID"]
          required = os.environ.get("REQUIRED", "").split()
          deadline = time.monotonic() + float(os.environ.get("TIMEOUT_MINUTES") or 60) * 60
          poll = float(os.environ.get("POLL_SECONDS") or 30)
          GREEN = {"success", "neutral", "skipped"}
          RUNNING = {"queued", "in_progress", "waiting", "requested", "pending"}


          class Transient(Exception):
              pass


          def get(path, key=None):
              url, items = f"{api}/repos/{repo}/{path}", []
              while url:
                  request = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "nexus-product-promote"})
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          body, link = json.load(response), response.headers.get("Link") or ""
                  except urllib.error.HTTPError as error:
                      if error.code >= 500 or error.code == 429:
                          raise Transient(f"{path}: HTTP {error.code}")
                      sys.exit(f"::error::GitHub API {path}: HTTP {error.code} {error.reason} (the caller's job must grant "
                               "actions: read, checks: read, contents: read, statuses: read)")
                  except (urllib.error.URLError, TimeoutError) as error:
                      raise Transient(f"{path}: {error}")
                  if key is None:
                      return body
                  items += body[key]
                  found = re.search(r'<([^>]+)>;\s*rel="next"', link)
                  url = found.group(1) if found else None
              return items


          def workflow(path):
              return path.split("@", 1)[0]


          def survey():
              """(red, waiting, green): one line per check."""
              red, waiting, green = [], [], []
              own = workflow(get(f"actions/runs/{run_id}")["path"])
              files = {entry["name"] for entry in get(f"contents/.github/workflows?ref={commit}") if entry["type"] == "file"}
              for name in required:
                  if name not in files:
                      red.append(f"required workflow {name}: no .github/workflows/{name} at {commit}")
              latest = {}
              for run in get(f"actions/runs?head_sha={commit}&per_page=100", "workflow_runs"):
                  path = workflow(run["path"])
                  if not path.startswith(".github/workflows/") or path == own:
                      continue
                  if path not in latest or run["id"] > latest[path]["id"]:
                      latest[path] = run
              for name in required:
                  if name in files and f".github/workflows/{name}" not in latest:
                      waiting.append(f"required workflow {name}: no run on {commit}")
              for path, run in sorted(latest.items()):
                  line = f"workflow {run['name']} ({path}): {run['status']}"
                  if run["status"] != "completed":
                      waiting.append(f"{line}, {run['html_url']}")
                  elif run["conclusion"] in GREEN:
                      green.append(f"{line}, {run['conclusion']}")
                  else:
                      red.append(f"{line}, {run['conclusion']}, {run['html_url']}")
              for check in get(f"commits/{commit}/check-runs?per_page=100", "check_runs"):
                  if (check.get("app") or {}).get("slug") == "github-actions":
                      continue  # the workflow runs above
                  line = f"check {check['name']} ({(check.get('app') or {}).get('slug')}): {check['status']}"
                  if check["status"] != "completed":
                      waiting.append(line)
                  elif check["conclusion"] in GREEN:
                      green.append(f"{line}, {check['conclusion']}")
                  else:
                      red.append(f"{line}, {check['conclusion']}, {check.get('html_url')}")
              for status in get(f"commits/{commit}/status?per_page=100", "statuses"):
                  line = f"status {status['context']}: {status['state']}"
                  if status["state"] == "success":
                      green.append(line)
                  elif status["state"] in RUNNING:
                      waiting.append(line)
                  else:
                      red.append(f"{line}, {status.get('target_url')}")
              return red, waiting, green


          def refuse(reason, lines):
              text = f"{dev or commit} is not promoted: {reason}\n" + "\n".join(f"- {line}" for line in lines)
              print("\n".join(f"::error::{line}" for line in text.splitlines()))
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(text + "\n")
              sys.exit(1)


          while True:
              try:
                  red, waiting, green = survey()
              except Transient as error:
                  red, waiting, green = [], [f"GitHub API unavailable ({error})"], []
              if red:
                  refuse("a check of its commit is red, cancelled or missing. Fix it on main (a new version), or re-run the "
                         "failed check then promote this build by hand.", red)
              if not waiting:
                  print(f"Every check of {commit} is green:\n" + "\n".join(f"- {line}" for line in green))
                  break
              if time.monotonic() >= deadline:
                  refuse("checks of its commit did not finish in time or never ran. Promote it by hand once they are green.",
                         waiting)
              print("Waiting for:\n" + "\n".join(f"- {line}" for line in waiting), flush=True)
              time.sleep(poll)

  promote:
    needs: [resolve, checks]
    if: needs.resolve.outputs.commit != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the tested development build as stable
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          DEV: ${{ needs.resolve.outputs.dev }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          PRODUCT: ${{ inputs.product }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a commit: $COMMIT"; exit 1; }
          [[ "$DEV" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-dev\.[0-9]+$ ]] || { echo "Not a development build: $DEV"; exit 1; }
          version="${BASH_REMATCH[1]}"
          stable="v$version"
          mkdir dist
          gh release download "$DEV" --repo "$REPOSITORY" --dir dist
          (cd dist && tr -d '\r' < SHA256SUMS.txt | sha256sum --strict -c -)
          git show "$COMMIT:CHANGELOG.md" > changelog.md
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## / {exit} on {print}' changelog.md > notes.md
          [[ -s notes.md ]] || { echo "CHANGELOG.md has no [$version] section at $COMMIT."; exit 1; }
          gh release create "$stable" dist/* --repo "$REPOSITORY" --target "$COMMIT" --title "$PRODUCT $version" --notes-file notes.md --latest
          echo "Promoted $DEV ($COMMIT) to $stable with the same files, every check of its commit green."
          echo "tag=$stable" >> "$GITHUB_OUTPUT"

  registry:
    # server.json to the official MCP registry: each .mcpb it lists, at the stable tag (URL and SHA-256). mcp-publisher
    # pinned by version and SHA-256; GitHub OIDC login, no token stored.
    needs: promote
    if: always() && (inputs.mcp-registry || inputs.mcp-package != '') && ((needs.promote.result == 'success' && needs.promote.outputs.tag != '') || inputs.registry-only != '')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.registry-only || needs.promote.outputs.tag }}
          persist-credentials: false
      - name: server.json for this release
        env:
          TAG: ${{ inputs.registry-only || needs.promote.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          version="${TAG#v}"
          sums=$(curl -fsSL --retry 5 "https://github.com/${REPOSITORY}/releases/download/${TAG}/SHA256SUMS.txt" | tr -d '\r')
          cp server.json server.release.json
          count=$(jq '[.packages[] | select(.registryType == "mcpb")] | length' server.json)
          [[ "$count" -ge 1 ]] || { echo "server.json lists no .mcpb package"; exit 1; }
          # Every .mcpb package server.json lists at this tag, by its file name: one per architecture if need be.
          for index in $(jq '.packages | to_entries[] | select(.value.registryType == "mcpb") | .key' server.json); do
            name=$(jq -r --argjson i "$index" '.packages[$i].identifier | split("/") | last' server.json)
            [[ "$name" =~ ^[A-Za-z0-9._-]+\.mcpb$ ]] || { echo "Not an .mcpb name: $name"; exit 1; }
            url="https://github.com/${REPOSITORY}/releases/download/${TAG}/${name}"
            curl -fsSL --retry 5 -o "$name" "$url"
            sha=$(sha256sum "$name" | cut -d' ' -f1)
            grep -qx "${sha}  ${name}" <<<"$sums" || { echo "$name differs from the attested SHA256SUMS.txt"; exit 1; }
            jq --argjson i "$index" --arg v "$version" --arg u "$url" --arg s "$sha" \
              '.version = $v | .packages[$i].version = $v | .packages[$i].identifier = $u | .packages[$i].fileSha256 = $s' \
              server.release.json > server.next.json
            mv server.next.json server.release.json
          done
          cat server.release.json
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --strict -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.release.json
