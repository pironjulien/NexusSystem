name: release-assets
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  # The one-line install as a release file too, for the way without "iex": get-nexus.ps1, its SHA-256 and a
  # provenance attestation (gh attestation verify get-nexus.ps1 --repo pironjulien/nexus-plugins).
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SHA-256
        run: sha256sum get-nexus.ps1 > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: get-nexus.ps1
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" get-nexus.ps1 SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
