name: pack
# The one-liner on a clean runner: the official Claude Code installer, the pinned signed Codex engine, and the folders
# by which Claude Desktop and Antigravity are found. Codex must install real plugins; an empty .codex folder cannot
# stand in for its engine. Each product's own installer runs (its latest release); then every server that each AI app
# declares is reached as that app would reach it (InstallTests), and the installed maintenance engine runs once from
# PowerShell 7 with exactly the command line of its task. The engine is this commit's, given to get-nexus.ps1 with
# -MaintenanceFrom since its release does not exist yet; the task then names that release (--test-catalog, this
# checkout; --test-engines, the engines' folder), which the engine verifies by SHA-256, so the cycle checks this
# commit's catalogue and engine, never the published release. Pending passes only for reasons listed in that step.
# The release workflow passes the very engines it is about to publish and publishes only once this check is green;
# by hand (gh workflow run pack.yml) it builds this commit's engine.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      engine-artifact:
        description: Artifact of this run holding NexusMaintenance-x64.exe (empty = build it from this commit)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  pack:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Official Codex engine (pinned release, SHA-256 and OpenAI signature verified)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue' # PowerShell 5.1 progress makes this large binary download very slow.
          $toolDir = Join-Path $env:RUNNER_TEMP 'codex-0.165.0'
          New-Item -ItemType Directory -Force $toolDir | Out-Null
          $engine = Join-Path $toolDir 'codex.exe'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/openai/codex/releases/download/rust-v0.165.0/codex-x86_64-pc-windows-msvc.exe' -OutFile $engine
          if ((Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash -ne 'D4B2E6A054EA1DFE53217F9D8942C5F8A9F4B76171A1E0BB76CED5759915300A') { throw 'Codex release SHA-256 mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath $engine
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -notmatch '(^|,\s*)(CN|O)="OpenAI OpCo, LLC"(?=,|$)') { throw 'Codex release lacks a valid OpenAI signature' }
          if ((& $engine --version) -ne 'codex-cli 0.165.0' -or $LASTEXITCODE) { throw 'Unexpected Codex engine version' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolDir
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Maintenance engine of the release being checked
        if: inputs.engine-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.engine-artifact }}
          path: ${{ runner.temp }}/engine
      - name: Maintenance engine of this commit (by hand)
        if: inputs.engine-artifact == ''
        shell: pwsh
        run: |
          dotnet publish app/src/Nexus.Maintenance/Nexus.Maintenance.csproj -c Release -r win-x64 -o "$env:RUNNER_TEMP/engine-build"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/engine" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/engine-build/NexusMaintenance.exe" "$env:RUNNER_TEMP/engine/NexusMaintenance-x64.exe"
      - name: Engine checksums, as the release lists them
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'engine'
          $lines = Get-ChildItem -LiteralPath $folder -Filter 'NexusMaintenance-*.exe' | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          if (-not $lines) { throw 'No maintenance engine to check.' }
          Set-Content -LiteralPath (Join-Path $folder 'SHA256SUMS.txt') -Value $lines -Encoding ascii
          $lines
      - name: AI apps present (Claude Code installed, Claude Desktop and Antigravity found by their folders)
        shell: powershell
        run: |
          # Anthropic's official installer as a file, run with -File (never code run in memory from the network).
          $installer = Join-Path $env:RUNNER_TEMP 'claude-install.ps1'
          Invoke-WebRequest -UseBasicParsing https://claude.ai/install.ps1 -OutFile $installer
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:APPDATA\Claude", "$env:USERPROFILE\.gemini\antigravity" | Out-Null
      - name: get-nexus.ps1 (Windows PowerShell 5.1), this commit's catalog
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          ./get-nexus.ps1 -Catalog $PWD -NoGuide -MaintenanceFrom (Join-Path $env:RUNNER_TEMP 'engine')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Every declared server starts
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;" + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:NEXUS_MCP_TOKEN = [Environment]::GetEnvironmentVariable('NEXUS_MCP_TOKEN', 'User')
          $env:NEXUS_PACK_CHECK_AIS = 'claude-code,claude-desktop,codex,antigravity'
          $env:NEXUS_PACK_CHECK_PRODUCTS = 'windows,android,browser,relay'
          dotnet test --project tests/NexusSystem.Tests --filter-class NexusSystem.Tests.InstallTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NEXUS_PACK_CHECK_AIS = 'antigravity'; $env:NEXUS_PACK_CHECK_PRODUCTS = 'agymail'
          dotnet test --project tests/NexusSystem.Tests --filter-class NexusSystem.Tests.InstallTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          claude mcp list
      - name: Second run changes nothing and stays green
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          ./get-nexus.ps1 -Catalog $PWD -NoGuide -MaintenanceFrom (Join-Path $env:RUNNER_TEMP 'engine')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The engine's cycle exactly as the "NexusSystem Update" task starts it: the action get-nexus.ps1 registered (with
      # -MaintenanceFrom: --test-catalog <this checkout> --test-engines <this run's engines>), no option added. The engine
      # then checks this commit's catalogue and itself against that folder's SHA256SUMS.txt, never the published release;
      # Codex keeps reading this checkout's catalogue in place, as get-nexus.ps1 -Catalog left it.
      - name: The maintenance engine, started from PowerShell 7 exactly as its task starts it, checks the products
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actions = @((Get-ScheduledTask -TaskName 'NexusSystem Update').Actions)
          if ($actions.Count -ne 1) { throw "The task has $($actions.Count) actions." }
          $action = $actions[0]
          $engine = Join-Path $env:USERPROFILE '.nexus\nexussystem\maintenance\NexusMaintenance.exe'
          $folders = foreach ($folder in $PWD, (Join-Path $env:RUNNER_TEMP 'engine')) { (Resolve-Path -LiteralPath $folder).ProviderPath.TrimEnd('\') }
          $expected = "--test-catalog `"$($folders[0])`" --test-engines `"$($folders[1])`""
          "Task action: $($action.Execute) $($action.Arguments)"
          if ($action.Execute -ne $engine -or $action.Arguments -cne $expected -or $action.WorkingDirectory) {
            throw "The task does not start the installed engine on the release being checked (expected: $engine $expected)."
          }
          codex plugin marketplace list --json
          # A run already started by the task would hold the engine's lock (exit 2 without a cycle): wait for its end.
          $deadline = (Get-Date).AddMinutes(30)
          while ((Get-ScheduledTask -TaskName 'NexusSystem Update').State -eq 'Running') {
            if ((Get-Date) -gt $deadline) { throw 'The task is still running after 30 minutes.' }
            Start-Sleep -Seconds 5
          }
          $statusPath = Join-Path $env:USERPROFILE '.nexus\status\nexussystem-update.json'
          if (Test-Path -LiteralPath $statusPath) { "A previous cycle left: $(Get-Content -Raw -LiteralPath $statusPath)" }
          $started = [DateTimeOffset]::UtcNow
          $arguments = @{}
          if ($action.Arguments) { $arguments.ArgumentList = $action.Arguments }
          $run = Start-Process -FilePath $action.Execute @arguments -Wait -PassThru
          $text = Get-Content -Raw -LiteralPath $statusPath
          $text
          $status = $text | ConvertFrom-Json
          if ([DateTimeOffset]$status.checked_at -lt $started) { throw 'The engine returned an earlier result (hourly pause or another run): no cycle was checked.' }
          $version = (Get-Content -Raw .claude-plugin/marketplace.json | ConvertFrom-Json).metadata.version
          if ($status.catalogue -ne "v$version") { throw "The cycle checked catalogue $($status.catalogue), not this commit's v$version." }
          # A catalogue route kept as another source means the engine did not take this checkout as the release checked.
          $kept = @($status.products | ForEach-Object { $_.profiles } | Where-Object { $_.route -eq 'catalogue' -and $_.state -eq 'kept' })
          if ($kept) { throw "Catalogue routes kept instead of maintained: $(($kept | ForEach-Object { "$($_.key): $($_.reason)" }) -join ' | ')" }
          if ($run.ExitCode -eq 0 -and $status.state -eq 'success') { 'Checked: every product current.'; exit 0 }
          if ($run.ExitCode -ne 2 -or $status.state -ne 'pending') { throw "NexusMaintenance exit code $($run.ExitCode), state $($status.state)." }
          # Pending (exit 2) passes only for the reasons below, each one a fact of a clean runner where no AI app and no
          # Chrome run, so no running connection can attest the installed engine. Any other pending row fails.
          $problems = foreach ($row in @($status.products | Where-Object state -eq 'pending')) {
            $current = $row.installedVersion -and $row.installedVersion -eq $row.publishedVersion
            switch ($row.key) {
              'windows' {
                # No AI app runs, so no NexusWindows engine runs under one: installed, nothing loaded, every route
                # waiting for its host's first start.
                $routes = @($row.profiles | Where-Object { $_.state -ne 'pending' -or $_.reason -ne 'No matching host-owned engine attestation; the existing session is preserved.' })
                $engines = @(Get-CimInstance Win32_Process -Filter "Name = 'NexusWindows.exe'" | Where-Object CommandLine -match '--mcp')
                if (-not $current -or @($row.loadedVersions).Count -or $routes -or $engines -or
                    $row.message -ne 'Installed; no running connection has attested activation yet.') { "windows: $($row.message)" }
              }
              'browser' {
                # The daemon runs the installed engine (same version and fingerprint); only Chrome's NexusBrowser
                # extension cannot answer, since no Chrome runs on the runner.
                $installed = Get-Content -Raw (Join-Path $env:LOCALAPPDATA 'NexusBrowser\current.json') | ConvertFrom-Json
                $health = Invoke-RestMethod -TimeoutSec 5 http://127.0.0.1:16182/health
                $loaded = @($row.loadedVersions | Where-Object { $_ -ne $row.installedVersion })
                if (-not $current -or $loaded -or (Get-Process chrome -ErrorAction SilentlyContinue) -or $health.version -ne $row.installedVersion -or
                    ($health.fingerprint -and $health.fingerprint -ne $installed.fingerprint) -or
                    $row.message -ne 'Installed; an older or unattested running connection is preserved until its safe reload.') { "browser: $($row.message)" }
              }
              default { "$($row.key): $($row.message)" }
            }
          }
          $failed = @($status.products | Where-Object { $_.state -notin 'success', 'pending', 'kept' } | ForEach-Object { "$($_.key) $($_.state): $($_.message)" })
          if ($problems -or $failed) { throw "Not accepted: $((@($problems) + $failed) -join ' | ')" }
          'Checked: pending only because no AI app or Chrome runs on this runner.'
