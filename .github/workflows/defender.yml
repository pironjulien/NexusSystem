name: defender
on:
  pull_request:
    paths: ['get-nexus.ps1', 'tests/defender_probe.ps1', '.github/workflows/defender.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Does Microsoft Defender block the one-line install the way a beginner starts it? Real-time protection on, each
  # way of starting in its own process, detections read back. Measurement only: it never fails the build.
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Defender probe
        shell: powershell
        run: ./tests/defender_probe.ps1
