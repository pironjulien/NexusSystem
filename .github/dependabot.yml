# Dependabot: weekly updates of the pinned GitHub Actions (SHA + version comment) and of the project's dependencies.
# A 7-day cooldown lets a compromised release be caught before it is proposed (zizmor dependabot-cooldown).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # Claude Code's command line, for `claude plugin validate` in CI only (test.yml).
  - package-ecosystem: npm
    directory: /tests/validators
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: nuget
    directories:
      - /app/src/Nexus.App
      - /app/src/Nexus.Core
      - /app/src/Nexus.Maintenance
      - /app/tests/Nexus.Core.Tests
      - /app/probe
      - /tests/NexusSystem.Tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
    # The AOT compiler and trimmer follow the runtime of the SDK global.json pins (.NET 11): a new major comes with the
    # SDK change, never alone (11.0.0 proposed on 2026-11-27 broke the locked restore).
    ignore:
      - dependency-name: Microsoft.DotNet.ILCompiler
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.NET.ILLink.Tasks
        update-types: ["version-update:semver-major"]
